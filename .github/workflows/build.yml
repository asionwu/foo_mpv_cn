name: build-mpv-latest

# 用途：用 mpv 上游的 ci/build-mingw64.sh 编译 mpv，产出可用的 mpv-2.dll + 依赖 DLL。
# 与官方 release.yml 的 libmpv job 的区别：**这里拉取 mpv 上游最新源码**，
# 而不是用仓库 submodule 里锁定的那个（可能落后的）commit，方便持续跟进上游。
#
# 用法见同目录说明或项目笔记：fork 仓库 -> push -> 手动 Run workflow / 等定时触发。

on:
  # 手动触发
  workflow_dispatch:

  # 每周一 05:00（北京时间）自动跑一次；不需要可删掉这段
  schedule:
    - cron: '0 21 * * 0'   # UTC 周日 21:00

# 只需要读权限（产物走 artifact，不需要写 release）
permissions:
  contents: read

jobs:
  libmpv:
    name: Build ${{ matrix.platform }} libmpv
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win32
            arch: i686
            wine: wine32
          - platform: x64
            arch: x86_64
            wine: wine64
    env:
      TARGET: ${{ matrix.arch }}-w64-mingw32
      RUST_TARGET: ${{ matrix.arch }}-pc-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 关键步骤：换成 mpv 上游最新源码。
      # 仓库里的 mpv/ 是 submodule，指向某个固定 commit（可能落后好几个月），
      # 直接删掉重新浅克隆，保证编出来的是上游最新。
      - name: Fetch latest mpv upstream
        run: |
          rm -rf mpv
          git clone --depth=1 https://github.com/mpv-player/mpv.git mpv
          echo "== mpv upstream commit =="
          git -C mpv log -1 --format='%H%n%ci%n%s'

      - name: Install upstream build tools
        run: |
          rustup target add "$RUST_TARGET"
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ccache g++-mingw-w64 gcc-multilib glslang-tools python3-pip \
            nasm ninja-build pkgconf ${{ matrix.wine }} wine
          python -m pip install meson
          command -v glslangValidator && glslangValidator --version

      - name: Install upstream Meson wraps
        working-directory: mpv
        run: |
          mkdir -p subprojects
          meson wrap install mujs
          meson subprojects download

      - name: Build with upstream MinGW recipe
        working-directory: mpv
        run: |
          ./ci/build-mingw64.sh            # 先编全部依赖
          ./ci/build-mingw64.sh meson pack # 再编 mpv 并打包运行时 DLL

      - name: Print mpv Meson log on failure
        if: failure()
        working-directory: mpv
        run: |
          if [ -f mingw_build/meson-logs/meson-log.txt ]; then
            tail -n 250 mingw_build/meson-logs/meson-log.txt
          fi

      # 与官方 CI 一致：编完先跑一次冒烟测试，确认 mpv_create 能成功，
      # 避免把加载不了的 DLL 发出去。
      - name: Collect and smoke-test libmpv
        run: |
          test -f mpv/mingw_build/libmpv-2.dll
          cp mpv/mingw_build/libmpv-2.dll mpv/artifact/mpv-2.dll
          "$TARGET-gcc-posix" -I mpv/include scripts/smoke-libmpv.c -o mpv/artifact/smoke-libmpv.exe
          cd mpv/artifact
          wine ./smoke-libmpv.exe ./mpv-2.dll
          rm -f smoke-libmpv.exe

      - name: Upload libmpv runtime
        uses: actions/upload-artifact@v7
        with:
          name: mpv-${{ matrix.platform }}
          if-no-files-found: error
          # mpv/artifact/ 里含 mpv-2.dll + 全部依赖 DLL（由 meson pack 收集）
          path: mpv/artifact/
          retention-days: 90
